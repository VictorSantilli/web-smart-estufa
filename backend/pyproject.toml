[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Piso de cobertura: o CI falha se cair abaixo disso.
fail_under = 95
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]  # Depends() em parâmetros padrão é o padrão do FastAPI
